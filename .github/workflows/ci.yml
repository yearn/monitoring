name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

# Every `uv sync` / `uv run` must match uv.lock exactly (hash-pinned deps and tools).
env:
  UV_LOCKED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Keep in sync with `required-version` in pyproject.toml and deploy/install.sh.
          version: "0.13.9"
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5" # x86_64-unknown-linux-gnu
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Keep in sync with `required-version` in pyproject.toml and deploy/install.sh.
          version: "0.13.9"
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5" # x86_64-unknown-linux-gnu
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check code with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Check types with ty
        run: uv run ty check

      - name: Audit GitHub Actions with zizmor
        run: uv run zizmor --offline .github/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Keep in sync with `required-version` in pyproject.toml and deploy/install.sh.
          version: "0.13.9"
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5" # x86_64-unknown-linux-gnu
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Audit dependencies for known vulnerabilities
        run: uv audit --preview-features audit-command
