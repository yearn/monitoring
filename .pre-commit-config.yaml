# Pre-commit hooks. Compatible with both `pre-commit` and `prek` (https://github.com/j178/prek).
# Install the git hook with:  prek install   (or)   pre-commit install
# Run against all files with:  prek run --all-files
#
# All hooks are local and run through `uv run --locked`, so every tool comes from
# the hash-pinned uv.lock instead of a mutable hook-repo tag.
repos:
  - repo: local
    hooks:
      # Lint (with autofix), then format — mirrors the CI checks.
      - id: ruff-check
        name: Lint with ruff
        entry: uv run --locked --extra dev ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Format with ruff
        entry: uv run --locked --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: Check types with ty
        entry: uv run --locked --extra dev ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: zizmor
        name: Audit GitHub Actions with zizmor
        entry: uv run --locked --extra dev zizmor --offline
        language: system
        files: ^\.github/(workflows/.*\.ya?ml|dependabot\.ya?ml)$
